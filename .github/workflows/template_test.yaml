name: Template Test

on:
  workflow_call:

permissions: {}

jobs:
  build_test:
    name: Test Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Test Build
        run: bun run build
  vitest:
    name: Vitest (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 📦 Install playwright with dependencies
        run: bunx playwright install --with-deps --only-shell chromium
      - name: 🧪 Test files
        run: bun run tests --reporter=default --reporter=blob --outputFile.blob=.vitest/reports/blob-${{ matrix.shard }}.json --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: 📤 Upload vitest shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/reports/
          if-no-files-found: error
          retention-days: 1
  vitest_merge_reports:
    name: Merge Vitest Shard Reports
    runs-on: ubuntu-latest
    needs: vitest
    if: always() && needs.vitest.result != 'skipped' && needs.vitest.result != 'cancelled'
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 📥 Download vitest shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: vitest-blob-*
          path: .vitest/reports/
          merge-multiple: true
      - name: 🧩 Merge shard reports
        run: bun run tests --merge-reports .vitest/reports
