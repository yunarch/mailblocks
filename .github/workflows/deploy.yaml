name: Deploy & Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: The type of release to prepare
        type: choice
        options:
          - conventional
          - major
          - minor
          - patch
        default: conventional
        required: true

permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗️ Build
        run: bun run build
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: './dist'
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📝 Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          output-file: 'false'
          skip-commit: 'true'
          skip-on-empty: 'false'
          skip-git-pull: 'true'
          skip-tag: 'true'
          git-push: 'false'
      - name: 🏷️ Get version
        id: version
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          OLD_VERSION: ${{ steps.changelog.outputs.old_version }}
          CONVENTIONAL_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          if [ "$RELEASE_VERSION" = "conventional" ]; then
            TAG="$CONVENTIONAL_TAG"
          else
            CURRENT="${OLD_VERSION:-0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${CURRENT%%[-+]*}"
            case "$RELEASE_VERSION" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "Unknown release type: $RELEASE_VERSION" >&2; exit 1 ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 🔖 Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
