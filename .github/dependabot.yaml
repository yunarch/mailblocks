version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    versioning-strategy: increase
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: sunday
      time: '12:00'
      timezone: 'Europe/Madrid'
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: sunday
      time: '12:00'
      timezone: 'Europe/Madrid'
